name: Manual Incremental Announcement Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: announcement-board
  cancel-in-progress: false

jobs:
  build:
    name: Manual incremental update
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent data from Pages
        shell: bash
        run: |
          set -u
          rm -rf .ghpages_state
          mkdir -p .ghpages_state cninfo_announce_archive data_archive
          if git fetch --depth=1 origin gh-pages:gh-pages-cache 2>/dev/null; then
            git archive gh-pages-cache data_archive 2>/dev/null | tar -x -C .ghpages_state || true
          fi
          if [ -d .ghpages_state/data_archive ]; then
            cp -r .ghpages_state/data_archive/* cninfo_announce_archive/ 2>/dev/null || true
            cp .ghpages_state/data_archive/cninfo_announce_state.json . 2>/dev/null || true
            cp .ghpages_state/data_archive/market_cap_cache.json . 2>/dev/null || true
            cp .ghpages_state/data_archive/data_list.js reports/dashboard/data_list.js 2>/dev/null || true
            cp .ghpages_state/data_archive/data_kline*.js reports/dashboard/ 2>/dev/null || true
            cp .ghpages_state/data_archive/board.db.zst data_archive/board.db.zst 2>/dev/null || true
          fi
          if [ -d data_archive ] && [ -n "$(ls -A data_archive 2>/dev/null || true)" ]; then
            cp -r data_archive/* cninfo_announce_archive/ 2>/dev/null || true
            cp data_archive/cninfo_announce_state.json . 2>/dev/null || true
            cp data_archive/market_cap_cache.json . 2>/dev/null || true
            cp data_archive/board.db.zst . 2>/dev/null || true
          fi
          if [ ! -s cninfo_announce_filtered.json ]; then
            LATEST=$(ls -1t cninfo_announce_archive/filtered_*.json 2>/dev/null | head -n 1 || true)
            if [ -n "$LATEST" ]; then cp "$LATEST" cninfo_announce_filtered.json; fi
          fi

      - name: Self check
        run: python scripts/self_check.py

      - name: Fetch Eastmoney announcements
        id: fetch
        shell: bash
        env:
          GITHUB_ACTIONS: '1'
        run: |
          set +e
          python scripts/eastmoney_fetch.py
          STATUS=$?
          echo "fetch_exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::东方财富公告增量采集失败；继续使用最近成功归档生成看板。"
          fi
          exit 0

      - name: Validate announcement input
        id: input
        shell: bash
        run: |
          if [ -s cninfo_announce_filtered.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('cninfo_announce_filtered.json').read_text(encoding='utf-8'))
          if not isinstance(rows, list):
              raise SystemExit('filtered announcement data must be a list')
          print(f'validated announcement rows: {len(rows)}')
          PY
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::error::没有可用公告数据，也没有可恢复的历史归档。"
            exit 1
          fi

      - name: Extract Eastmoney announcement content
        continue-on-error: true
        timeout-minutes: 60
        run: python mainboard_tool/extract_auto.py

      - name: Determine report window
        id: report_window
        shell: bash
        run: |
          set -u
          TODAY=$(TZ=Asia/Shanghai date +%F)
          START=$(TZ=Asia/Shanghai date -d '1 day ago' +%F)
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$TODAY" >> "$GITHUB_OUTPUT"
          echo "report_window=$START~$TODAY"

      - name: Generate rule report
        timeout-minutes: 30
        run: python mainboard_tool/rule_summarize.py "${{ steps.report_window.outputs.start }}" "${{ steps.report_window.outputs.end }}"

      - name: Require SQLite historical baseline
        shell: bash
        run: |
          if [ -s board.db ]; then
            echo '[DB] SQLite baseline ready'
          elif [ -s data_archive/board.db.zst ]; then
            echo '[DB] Persistent SQLite archive ready'
          else
            echo '::error::SQLite历史基线未安装。请把 board.db.zst 上传到 data_seed/ 后再运行手动增量流程。'
            exit 1
          fi

      - name: Generate dashboard data (SQLite incremental)
        timeout-minutes: 30
        env:
          GITHUB_ACTIONS: '1'
          REQUIRE_SQLITE: '1'
        run: python scripts/gen_dashboard_incremental.py

      - name: Normalize dashboard and add manual update button
        shell: bash
        run: |
          set -u
          for f in reports/dashboard/dashboard.html reports/dashboard/index.html; do
            [ -f "$f" ] || continue
            python - "$f" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8').replace('巨潮资讯', '东方财富')
          s = s.replace('style="flex-wrap:nowrap;"', 'style="flex-wrap:wrap;"')
          marker = 'data-manual-update="1"'
          if marker not in s:
              link = 'https://github.com/baibiaowang/agu-board/actions/workflows/manual-incremental-update.yml'
              block = f'''\n<div data-manual-update="1" style="padding:8px 24px;display:flex;justify-content:flex-end;align-items:center;background:#ffffff;border-bottom:1px solid #e6e8ef;">\n  <a href="{link}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:#1677ff;color:#fff;text-decoration:none;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.10);">\n    ↻ 手动增量采集\n  </a>\n</div>\n'''
              anchor = '<div class="main">'
              s = s.replace(anchor, block + anchor, 1) if anchor in s else s.replace('</body>', block + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          done

      - name: Build site and persist runtime state
        shell: bash
        run: |
          set -u
          mkdir -p _site _site/data_archive _site/lib
          cp -r reports/dashboard/* _site/
          [ -s _site/index.html ] || { [ -s _site/dashboard.html ] && cp _site/dashboard.html _site/index.html; }
          [ -s _site/index.html ] || { echo 'dashboard index missing' >&2; exit 1; }
          [ -s _site/data_list.js ] || echo 'window.ANNO_LIST = [];' > _site/data_list.js
          rm -f _site/data_kline.js
          SHARDS=$(python -c "import re,pathlib;p=pathlib.Path('_site/data_kline_manifest.js');t=p.read_text(encoding='utf-8') if p.exists() else '';m=re.search(r'\"shards\"\s*:\s*(\d+)',t);print(m.group(1) if m else 16)")
          for i in $(seq 0 $((SHARDS-1))); do
            [ -f "_site/data_kline_${i}.js" ] || echo "window.ANNO_KLINE_SHARD_${i} = {};" > "_site/data_kline_${i}.js"
          done
          [ -s _site/data_kline_manifest.js ] || echo 'window.ANNO_KLINE_SHARDS = {"shards": 1, "codes": 0, "bars": 0};' > _site/data_kline_manifest.js
          if [ -s reports/dashboard/lib/echarts.min.js ]; then
            cp reports/dashboard/lib/echarts.min.js _site/lib/echarts.min.js
          elif [ ! -s _site/lib/echarts.min.js ]; then
            curl -fsSL --retry 3 --retry-delay 2 -o _site/lib/echarts.min.js https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js
          fi
          test -s _site/lib/echarts.min.js
          cp -r cninfo_announce_archive/* _site/data_archive/ 2>/dev/null || true
          cp cninfo_announce_state.json _site/data_archive/ 2>/dev/null || true
          cp market_cap_cache.json _site/data_archive/ 2>/dev/null || true
          cp _site/data_list.js _site/data_archive/data_list.js
          cp _site/data_kline*.js _site/data_archive/
          rm -f _site/data_archive/data_kline.js
          test -s board.db
          zstd -1 -q -f board.db -o _site/data_archive/board.db.zst
          test -s _site/data_archive/board.db.zst
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'source': 'eastmoney',
              'mode': 'incremental',
              'fetch_exit_code': '${{ steps.fetch.outputs.fetch_exit_code }}',
              'input_valid': '${{ steps.input.outputs.valid }}',
              'report_start': '${{ steps.report_window.outputs.start }}',
              'report_end': '${{ steps.report_window.outputs.end }}',
              'database': 'sqlite-incremental',
          }
          Path('_site/data_archive/pipeline_status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Pre-deploy health check
        shell: bash
        run: |
          set -u
          test -s _site/index.html
          test -s _site/data_list.js
          test -s _site/data_kline_manifest.js
          test -s _site/data_kline_0.js
          test -s _site/lib/echarts.min.js
          test -s _site/data_archive/board.db.zst
          grep -q 'window.ANNO_LIST' _site/data_list.js
          grep -q 'window.ANNO_KLINE_SHARDS' _site/data_kline_manifest.js
          grep -q 'window.ANNO_KLINE_SHARD_0' _site/data_kline_0.js
          echo 'PRE-DEPLOY DB HEALTH: OK'
          echo 'PRE-DEPLOY HEALTH: OK'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          commit_message: 'Manual incremental board update ${{ github.run_id }}'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-debug-output-${{ github.run_id }}
          path: |
            cninfo_announce_*.json
            cninfo_announce_archive/
            announce_pdf/
            announce_txt/
            _site/data_archive/pipeline_status.json
            _site/data_archive/board.db.zst
          if-no-files-found: warn
          retention-days: 7

      - name: Final health summary
        if: always()
        shell: bash
        run: |
          echo '=== Manual incremental board final summary ==='
          echo "fetch_exit_code=${{ steps.fetch.outputs.fetch_exit_code }}"
          echo "input_valid=${{ steps.input.outputs.valid }}"
          echo "report_window=${{ steps.report_window.outputs.start }}~${{ steps.report_window.outputs.end }}"
          test -s _site/index.html && echo 'site_outputs=OK' || echo 'site_outputs=INCOMPLETE'
          test -s _site/data_archive/board.db.zst && echo 'database_persistence=OK' || echo 'database_persistence=INCOMPLETE'
