name: Update A-Share Announcement Board

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '30 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      full_rescan:
        description: 'Full rescan (reset state and re-fetch recent window)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      preset:
        description: 'Time range preset'
        required: false
        default: ''
        type: choice
        options: ['', '3d', '1w', '2w', '1m']
      start_date:
        description: 'Backfill start date (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: 'Backfill end date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent data
        run: |
          mkdir -p cninfo_announce_archive
          if [ -d data_archive ] && [ -n "$(ls -A data_archive 2>/dev/null)" ]; then
            cp -r data_archive/* cninfo_announce_archive/ 2>/dev/null || true
            cp data_archive/cninfo_announce_state.json . 2>/dev/null || true
            cp data_archive/market_cap_cache.json . 2>/dev/null || true
          else
            git fetch origin gh-pages:gh-pages-temp || true
            if git show-ref --quiet refs/remotes/origin/gh-pages-temp; then
              git checkout gh-pages-temp -- data_archive/ 2>/dev/null || true
              cp -r data_archive/* cninfo_announce_archive/ 2>/dev/null || true
              cp data_archive/cninfo_announce_state.json . 2>/dev/null || true
              cp data_archive/market_cap_cache.json . 2>/dev/null || true
            fi
          fi
          # Seed current input from the newest saved archive so transient network
          # failure does not destroy report/dashboard generation.
          if [ ! -s cninfo_announce_filtered.json ]; then
            LATEST=$(ls -1t cninfo_announce_archive/filtered_*.json 2>/dev/null | head -n 1 || true)
            if [ -n "$LATEST" ]; then cp "$LATEST" cninfo_announce_filtered.json; echo "Seeded current filtered data from $LATEST"; fi
          fi

      - name: Self check
        run: python scripts/self_check.py

      - name: Run Eastmoney announcement fetch
        id: fetch
        continue-on-error: true
        timeout-minutes: 60
        env:
          GITHUB_ACTIONS: '1'
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          PRESET="${{ github.event.inputs.preset }}"
          FULL="${{ github.event.inputs.full_rescan }}"
          if [ -n "$START" ]; then
            [ -n "$END" ] || END=$(date -u +%F)
            python scripts/eastmoney_fetch.py "$START" "$END"
          elif [ "$FULL" = "true" ]; then
            python scripts/eastmoney_fetch.py --full
          elif [ -n "$PRESET" ]; then
            python scripts/eastmoney_fetch.py "$PRESET"
          else
            python scripts/eastmoney_fetch.py
          fi

      - name: Persist announcement data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data_archive
          cp -r cninfo_announce_archive/* data_archive/ 2>/dev/null || true
          cp cninfo_announce_state.json data_archive/ 2>/dev/null || true
          cp market_cap_cache.json data_archive/ 2>/dev/null || true
          git add -f data_archive/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist announcement archive $(date +%F)" || true
          git push origin main || true

      - name: Ensure ECharts library
        if: always()
        run: |
          mkdir -p reports/dashboard/lib
          if [ ! -s reports/dashboard/lib/echarts.min.js ]; then
            curl -fsSL -o reports/dashboard/lib/echarts.min.js https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js
          fi

      - name: Extract Eastmoney PDFs
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        run: python mainboard_tool/extract_auto.py

      - name: Generate rule report
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ -s cninfo_announce_filtered.json ]; then
            python mainboard_tool/rule_summarize.py
          else
            echo 'No filtered announcement data available; skip report.'
          fi

      - name: Generate dashboard
        if: always()
        continue-on-error: true
        timeout-minutes: 45
        env:
          GITHUB_ACTIONS: '1'
        run: python scripts/gen_dashboard.py

      - name: Prepare deployment
        if: always()
        run: |
          mkdir -p _site
          cp -r reports/dashboard/* _site/ 2>/dev/null || true
          [ -f _site/data_list.js ] || echo 'window.ANNO_LIST = [];' > _site/data_list.js
          [ -f _site/data_kline.js ] || echo 'window.ANNO_KLINE = {};' > _site/data_kline.js
          mkdir -p _site/lib
          cp reports/dashboard/lib/echarts.min.js _site/lib/ 2>/dev/null || true
          mkdir -p _site/data_archive
          cp -r cninfo_announce_archive/* _site/data_archive/ 2>/dev/null || true
          cp cninfo_announce_state.json _site/data_archive/ 2>/dev/null || true
          cp market_cap_cache.json _site/data_archive/ 2>/dev/null || true
          if [ -f _site/dashboard.html ]; then cp _site/dashboard.html _site/index.html; fi

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: false
          keep_files: true
          commit_message: 'Update board ${{ github.run_id }}'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output-${{ github.run_id }}
          path: |
            cninfo_announce_*.json
            cninfo_announce_archive/
            announce_pdf/
            announce_txt/
            reports/
          if-no-files-found: warn
          retention-days: 7
