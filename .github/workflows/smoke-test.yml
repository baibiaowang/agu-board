name: End-to-End Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CI configuration
        run: python scripts/validate_ci_config.py

      - name: Static self-check
        run: python scripts/self_check.py

      - name: Detect historical SQLite seed
        shell: bash
        run: |
          if [ -s data_seed/board.db.zst ]; then
            echo '[SMOKE] historical SQLite seed present'
          else
            echo '[SMOKE] no historical SQLite seed in main branch; network-compatible mode will be used'
          fi

      - name: Eastmoney fetch smoke test
        env:
          GITHUB_ACTIONS: '1'
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          YESTERDAY=$(TZ=Asia/Shanghai date -d '1 day ago' +%F)
          python scripts/eastmoney_fetch.py "$YESTERDAY" "$TODAY"
          test -s cninfo_announce_all.json
          test -s cninfo_announce_filtered.json

      - name: PDF/content extraction smoke test
        run: python mainboard_tool/extract_auto.py

      - name: Report smoke test
        run: python mainboard_tool/rule_summarize.py "$(TZ=Asia/Shanghai date -d '1 day ago' +%F)" "$(TZ=Asia/Shanghai date +%F)"

      - name: Dashboard smoke test (SQLite incremental)
        env:
          GITHUB_ACTIONS: '1'
        run: python scripts/gen_dashboard_incremental.py

      - name: Verify outputs
        run: |
          test -s reports/dashboard/data_list.js
          test -s reports/dashboard/dashboard.html
          if [ -s board.db ]; then
            python - <<'PY'
            from scripts.board_db import connect, integrity_check, seed_stats
            con = connect()
            integrity_check(con)
            print('[SMOKE] SQLite integrity OK:', seed_stats(con))
            con.close()
            PY
          fi
          echo 'END-TO-END SMOKE TEST PASSED'
