name: End-to-End Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate CI configuration
        run: python scripts/validate_ci_config.py

      - name: Static self-check
        run: python scripts/self_check.py

      - name: Detect historical SQLite seed
        shell: bash
        run: |
          if [ -s data_seed/board.db.zst ]; then
            echo '[SMOKE] historical SQLite seed present'
            echo 'has_seed=true' >> "$GITHUB_OUTPUT"
          else
            echo '[SMOKE] historical SQLite seed absent; full dashboard generation will be skipped to avoid the legacy network-heavy path'
            echo 'has_seed=false' >> "$GITHUB_OUTPUT"
          fi
        id: seed

      - name: Eastmoney fetch smoke test
        env:
          GITHUB_ACTIONS: '1'
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          YESTERDAY=$(TZ=Asia/Shanghai date -d '1 day ago' +%F)
          python scripts/eastmoney_fetch.py "$YESTERDAY" "$TODAY"
          test -s cninfo_announce_all.json
          test -s cninfo_announce_filtered.json

      - name: PDF/content extraction smoke test
        run: python mainboard_tool/extract_auto.py

      - name: Report smoke test
        run: python mainboard_tool/rule_summarize.py "$(TZ=Asia/Shanghai date -d '1 day ago' +%F)" "$(TZ=Asia/Shanghai date +%F)"

      - name: Dashboard smoke test (SQLite incremental)
        if: steps.seed.outputs.has_seed == 'true'
        env:
          GITHUB_ACTIONS: '1'
          REQUIRE_SQLITE: '1'
        run: python scripts/gen_dashboard_incremental.py

      - name: Dashboard incremental code smoke test without seed
        if: steps.seed.outputs.has_seed != 'true'
        run: python -m py_compile scripts/board_db.py scripts/gen_dashboard_incremental.py

      - name: Verify outputs
        if: steps.seed.outputs.has_seed == 'true'
        working-directory: scripts
        run: |
          test -s ../reports/dashboard/data_list.js
          test -s ../reports/dashboard/dashboard.html
          test -s ../board.db
          python - <<'PY'
          from board_db import connect, integrity_check, seed_stats
          con = connect()
          try:
              integrity_check(con)
              print('[SMOKE] SQLite integrity OK:', seed_stats(con))
          finally:
              con.close()
          PY
          echo 'END-TO-END SMOKE TEST PASSED'

      - name: Verify code-only outputs without historical seed
        if: steps.seed.outputs.has_seed != 'true'
        run: echo 'END-TO-END CODE SMOKE TEST PASSED; historical dashboard smoke awaits data_seed/board.db.zst'
